---
image: registry.terraform.io/hashicorp/terraform:1.9.8

variables:
  TF_VERSION: "1.9.8"
  TFLINT_VERSION: "0.53.0"
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  LOCALSTACK_ENDPOINT: "http://localstack:4566"

stages:
  - lint
  - validate
  - plan
  - apply

.terraform-init: &terraform-init
  before_script:
    - terraform --version

# ── Lint ──────────────────────────────────────────────────────────────────────

fmt-check:
  stage: lint
  image: registry.terraform.io/hashicorp/terraform:${TF_VERSION}
  script:
    - terraform fmt -check -recursive .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

tflint:
  stage: lint
  image: ghcr.io/terraform-linters/tflint:v${TFLINT_VERSION}
  script:
    - tflint --init
    - |
      for dir in modules/networking modules/security-iam modules/storage-state modules/app-runtime environments/local; do
        echo "→ tflint $dir"
        tflint --chdir="$dir"
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

checkov:
  stage: lint
  image: bridgecrew/checkov:latest
  script:
    - checkov -d . --config-file .checkov.yaml --output cli --output junitxml --output-file-path console,checkov-report.xml
  artifacts:
    when: always
    reports:
      junit: checkov-report.xml
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Validate ──────────────────────────────────────────────────────────────────

validate:
  stage: validate
  image: registry.terraform.io/hashicorp/terraform:${TF_VERSION}
  script:
    - |
      for dir in modules/networking modules/security-iam modules/storage-state modules/app-runtime environments/local; do
        echo "→ validating $dir"
        terraform -chdir="$dir" init -backend=false -input=false -no-color > /dev/null
        terraform -chdir="$dir" validate
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Plan (LocalStack) ─────────────────────────────────────────────────────────

plan-local:
  stage: plan
  image: registry.terraform.io/hashicorp/terraform:${TF_VERSION}
  services:
    - name: localstack/localstack:3
      alias: localstack
      variables:
        SERVICES: s3,iam,kms,lambda,sqs,dynamodb,ec2,events,logs,sts
  script:
    - apk add --no-cache curl
    - |
      until curl -sf http://localstack:4566/_localstack/health | grep -q '"s3": "available"'; do
        sleep 3
      done
    - terraform -chdir=environments/local init -reconfigure
    - terraform -chdir=environments/local plan -var="localstack_endpoint=${LOCALSTACK_ENDPOINT}"
  artifacts:
    paths:
      - environments/local/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Apply (prod) ──────────────────────────────────────────────────────────────

apply-prod:
  stage: apply
  image: registry.terraform.io/hashicorp/terraform:${TF_VERSION}
  environment:
    name: production
  script:
    - |
      terraform -chdir=environments/prod init \
        -backend-config="bucket=${TF_STATE_BUCKET}" \
        -backend-config="key=platform/prod/terraform.tfstate" \
        -backend-config="region=${AWS_DEFAULT_REGION}" \
        -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
        -backend-config="encrypt=true"
    - terraform -chdir=environments/prod apply -auto-approve -input=false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  variables:
    AWS_ACCESS_KEY_ID: $PROD_AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $PROD_AWS_SECRET_ACCESS_KEY
    TF_STATE_BUCKET: $PROD_TF_STATE_BUCKET
    TF_LOCK_TABLE: $PROD_TF_LOCK_TABLE
