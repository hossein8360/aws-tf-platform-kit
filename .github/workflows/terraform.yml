name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/**"
      - ".tflint.hcl"
      - ".checkov.yaml"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/**"
      - ".tflint.hcl"
      - ".checkov.yaml"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  TFLINT_VERSION: "v0.53.0"
  PYTHON_VERSION: "3.12"
  AWS_REGION: us-east-1

jobs:
  lint-and-scan:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install checkov
        run: pip install checkov

      - name: Terraform Format Check
        run: |
          terraform fmt -recursive .
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git diff --quiet || (git add -A && git commit -m 'style: auto-format terraform' && git push)

      - name: TFLint Init
        run: tflint --init

      - name: TFLint
        run: |
          for dir in modules/networking modules/security-iam modules/storage-state modules/app-runtime environments/local; do
            echo "-> tflint $dir"
            tflint --chdir="$dir"
          done

      - name: Checkov
        run: checkov -d . --config-file .checkov.yaml --output github_failed_only

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: lint-and-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Validate modules and local env
        run: |
          for dir in modules/networking modules/security-iam modules/storage-state modules/app-runtime environments/local; do
            echo "-> validating $dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color > /dev/null
            terraform -chdir="$dir" validate
          done

  plan-local:
    name: Plan (LocalStack)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Start LocalStack
        run: docker compose up -d localstack

      - name: Wait for LocalStack
        run: |
          until curl -sf http://localhost:4566/_localstack/health | grep -q '"s3": "available"'; do
            sleep 3
          done

      - name: Terraform Init (local)
        working-directory: environments/local
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          cp -n terraform.tfvars.example terraform.tfvars || true
          terraform init -reconfigure

      - name: Terraform Plan (local)
        working-directory: environments/local
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: terraform plan -out=tfplan

  apply-prod:
    name: Apply (prod)
    runs-on: ubuntu-latest
    needs: plan-local
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_PROD_APPLY == 'true')
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: environments/prod
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=platform/prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Apply
        working-directory: environments/prod
        run: terraform apply -auto-approve -input=false
