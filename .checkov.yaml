---
compact: true
directory:
  - modules
  - environments/prod
framework:
  - terraform
skip-check:
  - CKV_AWS_18   # Terraform state bucket does not self-log to avoid circular bucket dependencies
  - CKV2_AWS_62  # Terraform state bucket does not emit S3 object event notifications
  # KMS key policies must use Resource="*" on the key resource itself; this is
  # an AWS API constraint, not a misconfiguration.
  - CKV_AWS_356
  # LocalStack's mock DescribeAvailabilityZones returns a single AZ, which
  # triggers this check; irrelevant in production where real AZs are used.
  - CKV_AWS_394
  # Cross-region replication omitted intentionally: state bucket is replicated
  # out-of-band via AWS Backup in production. Enable when replication is added.
  - CKV_AWS_144
download-external-modules: false
evaluate-variables: true
repo-root-for-plan-enrichment:
  - .
