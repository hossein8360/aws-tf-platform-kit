---
compact: true
directory:
  - modules
  - environments
framework:
  - terraform
skip-check:
  # S3 access logging: handled by the storage-state module explicitly
  - CKV_AWS_18
  # S3 versioning is conditionally enabled per environment
  - CKV2_AWS_62
  # LocalStack does not support all MFA-delete features
  - CKV_AWS_300
  # ALB/NLB access logs skipped for local env
  - CKV_AWS_91
  # Flow logs: enabled in networking module; skip duplicate check
  - CKV2_AWS_12
download-external-modules: false
evaluate-variables: true
repo-root-for-plan-enrichment:
  - .
